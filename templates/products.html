<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>威格 · 商品展示</title>
<style>
:root {
  --bg:        #f2f3f5;
  --card:      #ffffff;
  --border:    #e8e8ec;
  --header-bg: rgba(255,255,255,0.88);
  --text:      #1a1a1a;
  --text2:     #555;
  --text3:     #999;
  --accent:    #1a1a2e;
  --shadow:    0 1px 6px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.04);
  --shadow-hv: 0 4px 20px rgba(0,0,0,0.13), 0 1px 4px rgba(0,0,0,0.04);
  --radius:    14px;
  --col-gap:   14px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif;min-height:100vh;}

/* ── Header ── */
.header{
  position:sticky;top:0;z-index:100;
  background:var(--header-bg);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
  padding:0 24px;
  height:54px;display:flex;align-items:center;
}
.header-inner{
  width:100%;max-width:1600px;margin:0 auto;
  display:flex;align-items:center;gap:16px;
}
.logo{
  font-size:20px;font-weight:800;letter-spacing:2px;color:var(--text);
  text-decoration:none;user-select:none;
}
.logo em{font-style:normal;color:#c0392b;}
.header-subtitle{
  font-size:13px;color:var(--text3);font-weight:400;
  padding-left:14px;border-left:1px solid var(--border);
}
.header-spacer{flex:1;}
.header-count{font-size:12px;color:var(--text3);}

/* ── Search ── */
.search-wrap{display:flex;align-items:center;gap:0;margin-right:16px;}
.search-input{
  width:200px;height:32px;padding:0 12px;
  border:1.5px solid var(--border);border-right:none;
  border-radius:20px 0 0 20px;font-size:13px;
  outline:none;font-family:inherit;
  transition:border-color .2s,width .2s;
}
.search-input:focus{border-color:#aaa;width:240px;}
.search-btn{
  height:32px;padding:0 14px;
  background:var(--accent);color:#fff;border:none;
  border-radius:0 20px 20px 0;font-size:13px;
  cursor:pointer;font-family:inherit;
  transition:opacity .15s;
}
.search-btn:hover{opacity:.85;}
@media(max-width:768px){
  .search-wrap{margin-right:8px;}
  .search-input{width:120px;}
  .search-input:focus{width:150px;}
}

/* ── Filter bar ── */
.filter-wrap{
  position:sticky;top:54px;z-index:99;
  background:var(--card);
  border-bottom:1px solid var(--border);
  padding:0 24px;
}
.filter-inner{
  width:100%;max-width:1600px;margin:0 auto;
  display:flex;align-items:center;gap:6px;
  overflow-x:auto;padding:10px 0;
  scrollbar-width:none;
}
.filter-inner::-webkit-scrollbar{display:none;}
.filter-sep{
  width:1px;height:16px;background:var(--border);
  flex-shrink:0;margin:0 4px;
}
.filter-chip{
  flex-shrink:0;
  padding:5px 14px;border-radius:20px;
  border:1.5px solid var(--border);
  background:#fff;color:var(--text2);
  font-size:12px;font-family:inherit;
  cursor:pointer;transition:all 0.15s;white-space:nowrap;
  line-height:1.5;
}
.filter-chip:hover{border-color:#aaa;color:var(--text);}
.filter-chip.active{
  background:var(--accent);border-color:var(--accent);
  color:#fff;font-weight:600;
}
.filter-chip.is-parent{font-weight:600;color:var(--text);}
.filter-chip.is-parent.active{color:#fff;}

/* ── Page layout（侧边栏 + 内容区）── */
.page-layout{
  max-width:1600px;margin:0 auto;
  padding:20px 24px 40px;
  display:flex;gap:20px;align-items:flex-start;
}
/* ── Main ── */
.main{
  flex:1;min-width:0;
}

/* ── Masonry grid（JS 手动分列，彻底避免 CSS columns balance 空列问题） ── */
.products-grid{
  display:flex;
  align-items:flex-start;
  gap:var(--col-gap);
}
.masonry-col{
  flex:0 1 300px;min-width:0;
  display:flex;flex-direction:column;
  gap:var(--col-gap);
}
@media(max-width:768px){
  .page-layout{padding:12px 12px 40px;gap:0;}
  .filter-wrap{padding:0 12px;}
  .header{padding:0 12px;}
  .header-subtitle{display:none;}
  .filter-sidebar{display:none !important;}
}

/* ── Product card ── */
.product-card{
  background:var(--card);
  border-radius:var(--radius);
  overflow:hidden;
  /* margin-bottom 已移除：列间距由 .masonry-col { gap } 统一控制 */
  box-shadow:var(--shadow);
  transition:transform 0.2s ease, box-shadow 0.2s ease;
  cursor:pointer;
}
.product-card:hover{
  transform:translateY(-4px);
  box-shadow:var(--shadow-hv);
}
.card-img-wrap{
  width:100%;overflow:hidden;
  background:#f0f0f2;
}
.card-img-wrap img{
  width:100%;display:block;
  object-fit:cover;
  transition:transform 0.35s ease, opacity 0.3s;
  opacity:0;
}
.card-img-wrap img.loaded{opacity:1;}
.product-card:hover .card-img-wrap img{transform:scale(1.03);}
.card-img-placeholder{
  width:100%;aspect-ratio:3/4;
  display:flex;align-items:center;justify-content:center;
  font-size:40px;color:#d0d0d5;background:#f8f8fa;
}
.card-body{padding:11px 13px 14px;}
.card-name{
  font-size:13px;font-weight:500;color:var(--text);
  line-height:1.55;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;
  word-break:break-all;
}
.card-cat{
  margin-top:5px;
  font-size:11px;color:var(--text3);
  display:flex;align-items:center;gap:4px;
}
.card-cat::before{
  content:'';display:inline-block;
  width:5px;height:5px;border-radius:50%;
  background:currentColor;opacity:.6;
}
.card-attrs{
  margin-top:8px;
  display:flex;flex-wrap:wrap;gap:4px;
}
.attr-tag{
  font-size:11px;padding:2px 7px;
  background:#f4f4f7;color:var(--text2);
  border-radius:4px;border:1px solid #ebebef;
  white-space:nowrap;max-width:120px;
  overflow:hidden;text-overflow:ellipsis;
}

/* ── Filter Sidebar ── */
.filter-sidebar{
  flex:0 0 192px;
  position:sticky;top:120px;
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:14px 0 8px;
  display:none;
  max-height:calc(100vh - 140px);
  overflow-y:auto;
}
.filter-sidebar.visible{display:block;}
.sidebar-hd{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 14px 10px;
  border-bottom:1px solid var(--border);
  margin-bottom:4px;
}
.sidebar-hd-title{font-size:13px;font-weight:700;color:var(--text);}
.sidebar-clear-all{
  font-size:11px;color:var(--text3);
  border:none;background:none;padding:0;
  font-family:inherit;cursor:pointer;
  transition:color .15s;
}
.sidebar-clear-all:hover{color:var(--text);}
.sidebar-clear-all.hidden{visibility:hidden;}
.sidebar-group{
  padding:10px 14px 6px;
  border-bottom:1px solid var(--border);
}
.sidebar-group:last-child{border-bottom:none;}
.sidebar-group-title{
  font-size:11px;font-weight:600;color:var(--text3);
  letter-spacing:.4px;margin-bottom:8px;
}
.sidebar-option{
  display:flex;align-items:center;gap:7px;
  margin-bottom:7px;cursor:pointer;user-select:none;
}
.sidebar-option input[type=checkbox]{
  width:14px;height:14px;
  accent-color:var(--accent);
  cursor:pointer;flex-shrink:0;
}
.sidebar-option-label{
  font-size:13px;color:var(--text2);
  line-height:1.4;transition:color .15s;
}
.sidebar-option:hover .sidebar-option-label{color:var(--text);}
.sidebar-option input:checked + .sidebar-option-label{
  color:var(--accent);font-weight:600;
}
@media(max-width:1100px){.filter-sidebar{flex:0 0 164px;}}

/* ── States ── */
.state-box{
  text-align:center;padding:80px 20px 120px;
  color:var(--text3);
}
.state-box .s-icon{font-size:52px;margin-bottom:14px;opacity:.5;}
.state-box .s-text{font-size:14px;line-height:1.8;}

/* ── Skeleton loading ── */
.skeleton-grid{columns:5;column-gap:var(--col-gap);}
@media(max-width:1400px){.skeleton-grid{columns:4;}}
@media(max-width:1100px){.skeleton-grid{columns:3;}}
@media(max-width:768px){.skeleton-grid{columns:2;column-gap:10px;}}
.sk-card{
  break-inside:avoid;
  background:var(--card);border-radius:var(--radius);
  overflow:hidden;margin-bottom:var(--col-gap);box-shadow:var(--shadow);
}
.sk-img{width:100%;background:#edeef1;animation:skpulse 1.4s ease infinite;}
.sk-line{
  height:12px;border-radius:6px;background:#edeef1;
  margin:8px 13px;animation:skpulse 1.4s ease infinite;
}
.sk-line.short{width:55%;margin-top:6px;}
@keyframes skpulse{0%,100%{opacity:1;}50%{opacity:.45;}}

/* ── Modal overlay ── */
.modal-overlay{
  position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.72);
  display:flex;align-items:center;justify-content:center;
  padding:20px;
  opacity:0;pointer-events:none;
  transition:opacity .2s;
}
.modal-overlay.open{opacity:1;pointer-events:all;}

.modal-card{
  background:#fff;border-radius:18px;overflow:hidden;
  width:100%;max-width:860px;max-height:90vh;
  display:flex;position:relative;
  transform:scale(.95);transition:transform .2s;
}
.modal-overlay.open .modal-card{transform:scale(1);}

.modal-close{
  position:absolute;top:14px;right:14px;z-index:10;
  width:34px;height:34px;border-radius:50%;border:none;cursor:pointer;
  background:rgba(0,0,0,.35);color:#fff;font-size:17px;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s;
}
.modal-close:hover{background:rgba(0,0,0,.55);}

/* 左侧图片 / 轮播 */
.modal-img-panel{
  flex:0 0 50%;background:#111;
  display:flex;align-items:stretch;justify-content:stretch;
  min-height:420px;overflow:hidden;
}
.modal-img-placeholder{font-size:72px;color:#d0d0d5;margin:auto;}

/* 轮播容器 */
.carousel-wrap{width:100%;display:flex;flex-direction:column;}
.carousel-main{
  flex:1;position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  background:#111;
}
.carousel-main img{width:100%;height:100%;object-fit:cover;display:block;}
.carousel-counter{
  position:absolute;top:10px;left:12px;
  background:rgba(0,0,0,.45);color:#fff;
  font-size:11px;padding:3px 9px;border-radius:10px;
  backdrop-filter:blur(4px);pointer-events:none;
}
.carousel-arrow{
  position:absolute;top:50%;transform:translateY(-50%);
  background:rgba(0,0,0,.35);color:#fff;border:none;
  width:32px;height:48px;border-radius:5px;font-size:22px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .15s;backdrop-filter:blur(3px);z-index:5;line-height:1;
  padding:0;
}
.carousel-arrow:hover{background:rgba(0,0,0,.65);}
.carousel-prev{left:8px;}
.carousel-next{right:8px;}
.carousel-dots{
  position:absolute;bottom:12px;left:50%;transform:translateX(-50%);
  display:flex;gap:6px;align-items:center;
}
.carousel-dot{
  width:6px;height:6px;border-radius:50%;
  background:rgba(255,255,255,.5);
  cursor:pointer;transition:all .2s;flex-shrink:0;
}
.carousel-dot.active{
  width:18px;border-radius:3px;
  background:#fff;
}

/* 右侧信息 */
.modal-info-panel{
  flex:1;overflow-y:auto;
  padding:32px 28px 28px;
  display:flex;flex-direction:column;gap:14px;
}
.modal-cat{font-size:12px;color:var(--text3);}
.modal-name{font-size:19px;font-weight:700;color:var(--text);line-height:1.45;}
.modal-price-row{display:flex;align-items:baseline;gap:6px;}
.modal-price{font-size:30px;font-weight:800;color:#c0392b;}
.modal-price-unit{font-size:16px;font-weight:400;color:#c0392b;}
.modal-stock{font-size:13px;color:var(--text3);}
.modal-divider{height:1px;background:#f0f0f2;margin:2px 0;}
.modal-attrs-title{font-size:12px;font-weight:600;color:var(--text3);letter-spacing:.5px;}
.modal-attrs{display:flex;flex-direction:column;gap:10px;}
.modal-attr-row{display:flex;align-items:baseline;gap:10px;}
.modal-attr-name{
  flex-shrink:0;width:72px;
  font-size:12px;color:var(--text3);text-align:right;
}
.modal-attr-val{flex:1;font-size:14px;color:var(--text);}

@media(max-width:680px){
  .modal-card{flex-direction:column;max-height:95vh;}
  .modal-img-panel{flex:0 0 auto;height:240px;min-height:unset;}
  .modal-info-panel{padding:18px 16px 20px;}
}
</style>
</head>
<body>

<!-- Header -->
<header class="header">
  <div class="header-inner">
    <a href="/products/" class="logo">威<em>格</em></a>
    <span class="header-subtitle">商品展示</span>
    <div class="header-spacer"></div>
    <div class="search-wrap">
      <input id="search-input" type="text" class="search-input" placeholder="搜索商品名称…" autocomplete="off">
      <button class="search-btn" onclick="doSearch()">搜索</button>
    </div>
    <span class="header-count" id="header-count"></span>
  </div>
</header>

<!-- Category filter bar -->
<div class="filter-wrap">
  <div class="filter-inner" id="filter-bar">
    <button class="filter-chip active" data-id="">全部</button>
  </div>
</div>

<!-- Page layout: sidebar + content -->
<div class="page-layout">

  <!-- 左侧属性筛选面板（选中叶子品类后动态渲染） -->
  <aside class="filter-sidebar" id="filter-sidebar"></aside>

  <!-- Main content -->
  <main class="main">
    <div class="skeleton-grid" id="skeleton"></div>
    <div class="products-grid" id="products-grid" style="display:none"></div>
    <div class="state-box" id="state-box" style="display:none">
      <div class="s-icon">🔍</div>
      <div class="s-text">该品类暂无商品</div>
    </div>
  </main>

</div>

<script>
const API_CATS           = '/api/categories/public/';
const API_PRODS          = '/api/products/public/';
const API_FILTER_OPTIONS = '/api/products/filter-options/';

let activeCatId      = '';
let activeKeyword    = '';
let activeAttrFilters = {};   // { attr_def_id(Number): Set<string> }
let currentProducts  = [];

// ── 骨架屏 ──
(function buildSkeleton(){
  const heights = [220,280,180,240,300,200,260,190,250,210,230,170];
  const sk = document.getElementById('skeleton');
  sk.innerHTML = heights.map(h => `
    <div class="sk-card">
      <div class="sk-img" style="height:${h}px"></div>
      <div style="padding:10px 13px 14px">
        <div class="sk-line"></div>
        <div class="sk-line short"></div>
      </div>
    </div>`).join('');
})();

// ── 初始化 ──
(async function init(){
  // "全部"按钮绑定事件
  document.querySelector('.filter-chip[data-id=""]').addEventListener('click', () => setFilter(''));
  await loadCategories();
  await loadProducts();
})();

// ── 加载品类 ──
async function loadCategories(){
  try{
    const res  = await fetch(API_CATS);
    const json = await res.json();
    if(json.success) renderFilterBar(json.data);
  }catch(e){ console.error('品类加载失败', e); }
}

function renderFilterBar(cats){
  const map = {}, roots = [];
  cats.forEach(c => { map[c.id] = {...c, _children:[]}; });
  cats.forEach(c => {
    if(c.parent_id && map[c.parent_id]) map[c.parent_id]._children.push(map[c.id]);
    else roots.push(map[c.id]);
  });

  const bar = document.getElementById('filter-bar');
  function dfs(nodes, depth){
    nodes.forEach(n => {
      if(depth === 0){
        const sep = document.createElement('span');
        sep.className = 'filter-sep';
        bar.appendChild(sep);
      }
      const btn = document.createElement('button');
      btn.className = 'filter-chip' + (n._children.length ? ' is-parent' : '');
      btn.dataset.id = n.id;
      btn.textContent = n.category_name;
      btn.addEventListener('click', () => setFilter(String(n.id)));
      bar.appendChild(btn);
      if(n._children.length) dfs(n._children, depth + 1);
    });
  }
  dfs(roots, 0);
}

function setFilter(catId){
  activeCatId = catId;
  activeAttrFilters = {};   // 切换品类时清空属性筛选
  document.querySelectorAll('.filter-chip').forEach(b => {
    b.classList.toggle('active', b.dataset.id === catId);
  });
  loadFilterOptions(catId); // 异步加载侧边栏（与 loadProducts 并发）
  loadProducts();
}

// ── 侧边栏：加载属性选项 ──
async function loadFilterOptions(catId){
  if(!catId){ hideSidebar(); return; }
  try{
    const res  = await fetch(`${API_FILTER_OPTIONS}?category_id=${catId}`);
    const json = await res.json();
    if(json.success && json.data.length > 0){
      renderSidebar(json.data);
    } else {
      hideSidebar();
    }
  }catch(e){ hideSidebar(); }
}

// ── 侧边栏：渲染 ──
function renderSidebar(groups){
  const sidebar  = document.getElementById('filter-sidebar');
  const hasSel   = Object.keys(activeAttrFilters).length > 0;

  let html = `
    <div class="sidebar-hd">
      <span class="sidebar-hd-title">筛选</span>
      <button class="sidebar-clear-all${hasSel ? '' : ' hidden'}" onclick="clearAllFilters()">清空</button>
    </div>`;

  groups.forEach(g => {
    html += `<div class="sidebar-group">
      <div class="sidebar-group-title">${escHtml(g.attr_name)}</div>`;
    g.values.forEach(v => {
      const checked = activeAttrFilters[g.attr_def_id]?.has(v) ? 'checked' : '';
      html += `
        <label class="sidebar-option">
          <input type="checkbox" ${checked}
                 data-attr="${g.attr_def_id}"
                 data-val="${escHtml(v)}">
          <span class="sidebar-option-label">${escHtml(v)}</span>
        </label>`;
    });
    html += `</div>`;
  });

  sidebar.innerHTML = html;
  sidebar.querySelectorAll('input[type=checkbox]').forEach(cb => {
    cb.addEventListener('change', onAttrFilterChange);
  });
  sidebar.classList.add('visible');
}

// ── 侧边栏：单个复选框变更 ──
function onAttrFilterChange(e){
  const attrId = Number(e.target.dataset.attr);
  const val    = e.target.dataset.val;
  if(!activeAttrFilters[attrId]) activeAttrFilters[attrId] = new Set();
  if(e.target.checked){
    activeAttrFilters[attrId].add(val);
  } else {
    activeAttrFilters[attrId].delete(val);
    if(activeAttrFilters[attrId].size === 0) delete activeAttrFilters[attrId];
  }
  // 同步"清空"按钮显隐
  const clearBtn = document.querySelector('.sidebar-clear-all');
  if(clearBtn) clearBtn.classList.toggle('hidden', Object.keys(activeAttrFilters).length === 0);
  loadProducts();
}

// ── 侧边栏：清空全部筛选 ──
function clearAllFilters(){
  activeAttrFilters = {};
  document.querySelectorAll('#filter-sidebar input[type=checkbox]')
          .forEach(cb => { cb.checked = false; });
  const clearBtn = document.querySelector('.sidebar-clear-all');
  if(clearBtn) clearBtn.classList.add('hidden');
  loadProducts();
}

// ── 侧边栏：隐藏 ──
function hideSidebar(){
  const sidebar = document.getElementById('filter-sidebar');
  sidebar.classList.remove('visible');
  sidebar.innerHTML = '';
}

function doSearch(){
  activeKeyword = document.getElementById('search-input').value.trim();
  loadProducts();
}

// Enter 键触发搜索
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('search-input').addEventListener('keydown', e => {
    if(e.key === 'Enter') doSearch();
  });
});

// ── 当前视口的最大列数 ──
function getMaxCols(){
  const w = window.innerWidth;
  if(w <= 768)  return 2;
  if(w <= 1100) return 3;
  if(w <= 1400) return 4;
  return 5;
}

// ── JS Masonry：把商品按列数分配到各列 div ──
function renderMasonry(products){
  const grid = document.getElementById('products-grid');
  grid.innerHTML = '';
  if(!products.length) return;

  const colCount = Math.min(products.length, getMaxCols());
  // 创建列容器
  const cols = Array.from({length: colCount}, () => {
    const div = document.createElement('div');
    div.className = 'masonry-col';
    grid.appendChild(div);
    return div;
  });
  // 轮询分配
  products.forEach((p, i) => {
    cols[i % colCount].insertAdjacentHTML('beforeend', renderCard(p));
  });
  lazyLoadImages();
}

// ── 加载商品 ──
async function loadProducts(){
  const grid     = document.getElementById('products-grid');
  const skeleton = document.getElementById('skeleton');
  const stateBox = document.getElementById('state-box');
  const countEl  = document.getElementById('header-count');

  grid.style.display     = 'none';
  skeleton.style.display = '';
  stateBox.style.display = 'none';
  grid.innerHTML         = '';
  countEl.textContent    = '';

  const params = new URLSearchParams();
  if(activeCatId)   params.set('category_id', activeCatId);
  if(activeKeyword) params.set('q', activeKeyword);
  // 属性筛选：同属性多值用 append（生成 attr_1=红色&attr_1=蓝色）
  for(const [attrId, valSet] of Object.entries(activeAttrFilters)){
    for(const val of valSet){
      params.append(`attr_${attrId}`, val);
    }
  }
  const url = `${API_PRODS}${params.toString() ? '?' + params.toString() : ''}`;

  try{
    const res  = await fetch(url);
    const json = await res.json();
    skeleton.style.display = 'none';

    if(json.success && json.data.length > 0){
      currentProducts = json.data;
      grid.style.display = '';
      renderMasonry(currentProducts);
      countEl.textContent = `共 ${json.data.length} 件商品`;
    } else {
      currentProducts = [];
      stateBox.style.display = '';
    }
  }catch(e){
    skeleton.style.display = 'none';
    stateBox.style.display = '';
    console.error('商品加载失败', e);
  }
}

// ── 渲染单张卡片 ──
function renderCard(p){
  const imgHtml = p.primary_image_url
    ? `<img data-src="${p.primary_image_url}" alt="${escHtml(p.product_name)}">`
    : `<div class="card-img-placeholder">🏷️</div>`;

  const attrHtml = (p.attrs || []).slice(0, 4).map(a =>
    `<span class="attr-tag" title="${escHtml(a.name)}：${escHtml(a.value)}">${escHtml(a.name)}：${escHtml(a.value)}</span>`
  ).join('');

  return `
<div class="product-card" onclick="openModal(${p.id})">
  <div class="card-img-wrap">${imgHtml}</div>
  <div class="card-body">
    <div class="card-name">${escHtml(p.product_name)}</div>
    <div class="card-cat">${escHtml(p.category_name || '')}</div>
    ${attrHtml ? `<div class="card-attrs">${attrHtml}</div>` : ''}
  </div>
</div>`;
}

// ── 图片懒加载 ──
function lazyLoadImages(){
  if(!('IntersectionObserver' in window)){
    document.querySelectorAll('.card-img-wrap img[data-src]').forEach(img => {
      img.src = img.dataset.src;
      img.addEventListener('load', () => img.classList.add('loaded'));
    });
    return;
  }
  const io = new IntersectionObserver((entries, obs) => {
    entries.forEach(e => {
      if(!e.isIntersecting) return;
      const img = e.target;
      img.src = img.dataset.src;
      img.addEventListener('load', () => img.classList.add('loaded'), {once:true});
      img.removeAttribute('data-src');
      obs.unobserve(img);
    });
  }, {rootMargin:'200px'});
  document.querySelectorAll('.card-img-wrap img[data-src]').forEach(img => io.observe(img));
}

// resize 时重新按新列数排布
let _resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(_resizeTimer);
  _resizeTimer = setTimeout(() => {
    const grid = document.getElementById('products-grid');
    if(grid.style.display === 'none' || !currentProducts.length) return;
    renderMasonry(currentProducts);
  }, 120);
});

function escHtml(s){
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

// ── 轮播 ──────────────────────────────────────────────────────
let _carouselImages = [];
let _carouselIdx    = 0;

function _carouselRender(idx) {
  _carouselIdx = idx;
  const imgs  = _carouselImages;
  const total = imgs.length;
  const panel = document.getElementById('modal-img');
  if (!total) {
    panel.innerHTML = '<div class="modal-img-placeholder">🏷️</div>';
    return;
  }
  const cur     = imgs[idx];
  const hasMult = total > 1;
  panel.innerHTML = `
    <div class="carousel-wrap">
      <div class="carousel-main">
        <img src="${escHtml(cur.url)}" alt="">
        ${hasMult ? `<div class="carousel-counter">${idx + 1} / ${total}</div>` : ''}
        ${hasMult ? `<button class="carousel-arrow carousel-prev" onclick="_carouselPrev()">&#8249;</button>` : ''}
        ${hasMult ? `<button class="carousel-arrow carousel-next" onclick="_carouselNext()">&#8250;</button>` : ''}
        ${hasMult ? `
        <div class="carousel-dots">
          ${imgs.map((_, i) => `<div class="carousel-dot${i === idx ? ' active' : ''}" onclick="_carouselRender(${i})"></div>`).join('')}
        </div>` : ''}
      </div>
    </div>`;
}
function _carouselPrev() {
  const t = _carouselImages.length;
  _carouselRender((_carouselIdx - 1 + t) % t);
}
function _carouselNext() {
  _carouselRender((_carouselIdx + 1) % _carouselImages.length);
}

// ── Modal ──────────────────────────────────────────────────────
function openModal(productId){
  const p = currentProducts.find(x => x.id === productId);
  if(!p) return;

  // 左侧轮播
  _carouselImages = (p.images || []).slice().sort((a, b) => a.sort_order - b.sort_order);
  _carouselRender(0);

  // 右侧信息
  const attrRows = (p.attrs || []).map(a => `
    <div class="modal-attr-row">
      <span class="modal-attr-name">${escHtml(a.name)}</span>
      <span class="modal-attr-val">${escHtml(a.value)}</span>
    </div>`).join('');

  document.getElementById('modal-info').innerHTML = `
    <div class="modal-cat">${escHtml(p.category_name || '')}</div>
    <div class="modal-name">${escHtml(p.product_name)}</div>
    <div class="modal-price-row">
      <span class="modal-price-unit">¥</span>
      <span class="modal-price">${escHtml(String(p.product_price))}</span>
    </div>
    <div class="modal-stock">库存 ${p.product_stock} 件</div>
    ${attrRows ? `
      <div class="modal-divider"></div>
      <div class="modal-attrs-title">规格参数</div>
      <div class="modal-attrs">${attrRows}</div>` : ''}
  `;

  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal(){
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

// 点击遮罩关闭
document.getElementById('modal-overlay').addEventListener('click', function(e){
  if(e.target === this) closeModal();
});
// 键盘导航
document.addEventListener('keydown', function(e){
  if(!document.getElementById('modal-overlay').classList.contains('open')) return;
  if(e.key === 'ArrowLeft')  _carouselPrev();
  if(e.key === 'ArrowRight') _carouselNext();
  if(e.key === 'Escape')     closeModal();
});

// ESC 关闭
</script>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-card">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-img-panel" id="modal-img"></div>
    <div class="modal-info-panel" id="modal-info"></div>
  </div>
</div>
